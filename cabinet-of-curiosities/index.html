<!doctype html>
<html lang="en" data-site-preferences="theme">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes,viewport-fit=cover">
  <meta name="theme-color" content="#eee9dc" media="(prefers-color-scheme: light)" data-site-theme-color="light">
  <meta name="theme-color" content="#101713" media="(prefers-color-scheme: dark)" data-site-theme-color="dark">
  <meta name="description" content="Explore Martyna Zwoińska's Cabinet of Curiosities: an interactive collection of craft chocolate wrappers, tasting notes, crochet and cacao flavours.">
  <title>The Cabinet of Curiosities · Martyna Zwoińska</title>
  <link rel="canonical" href="https://martynazwoinska.github.io/cabinet-of-curiosities/">
  <script src="../shared/site-preferences.js?v=20260718-1"></script>
  <link rel="stylesheet" href="../shared/site-tokens.css?v=20260802-1">
  <link rel="stylesheet" href="cabinet.css?v=20260906-17">
</head>
<body>
  <main class="cabinet-page">
    <header class="cabinet-header">
      <a class="home-link" href="../index.html#beyond-research">← Martyna's site</a>
      <div class="header-actions">
        <button class="collection-toggle" id="collection-toggle" type="button" aria-expanded="false" aria-controls="collection-panel">Browse collection</button>
      </div>
    </header>

    <section class="orientation-notice" aria-labelledby="orientation-heading">
      <p class="eyebrow">Cabinet view</p>
      <h1 id="orientation-heading">Turn your phone sideways</h1>
      <p>The cabinet is designed to be explored horizontally.</p>
    </section>

    <section class="cabinet-stage" id="cabinet-stage" aria-label="Interactive cabinet display" tabindex="-1">
      <div class="scene-space" id="scene-space">
        <div class="scene-content">
        <svg width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute">
          <defs>
            <clipPath id="study-note-window" clipPathUnits="objectBoundingBox">
              <rect x=".248" y=".655" width=".06" height=".073"/>
            </clipPath>
          </defs>
        </svg>
        <div class="fantasy-surround" aria-hidden="true">
          <img class="study-room" src="assets/cabinet-study-unified-v2.png" width="1774" height="887" alt="">
          <img class="study-frame-foliage" src="assets/cabinet-frame-foliage-v2.png" width="1774" height="887" alt="">
          <picture class="surround-picture">
            <img src="assets/cabinet-clean-plate-v59.svg" width="1672" height="941" fetchpriority="high" alt="">
          </picture>
        </div>
        <figure class="board-shell" id="board-shell">
          <svg class="recess-depth" viewBox="0 0 1672 941" aria-hidden="true" focusable="false">
            <defs>
              <linearGradient id="recess-contact" x2="0" y2="1">
                <stop stop-color="#18140f" stop-opacity=".23"/>
                <stop offset="1" stop-color="#18140f" stop-opacity="0"/>
              </linearGradient>
              <filter id="ledge-soften" x="-10%" y="-100%" width="120%" height="300%"><feGaussianBlur stdDeviation="1.3"/></filter>
            </defs>
            <path d="M368 738H1308V744H368Z" fill="url(#recess-contact)"/>
            <path d="M370 160V102Q370 53 416 53H1259Q1307 53 1307 103V738" fill="none" stroke="#191510" stroke-opacity=".12" stroke-width="4" filter="url(#ledge-soften)"/>
            <path d="M368 740H1308" stroke="#d0b295" stroke-opacity=".15" stroke-width="1"/>
            <path d="M368 773H1308" stroke="#160f0b" stroke-opacity=".2" stroke-width="3" filter="url(#ledge-soften)"/>
          </svg>
          <div class="board-plane">
            <svg class="object-contact-shadows" viewBox="0 0 1672 941" aria-hidden="true" focusable="false">
              <defs>
                <filter id="wrapper-contact-shadow" x="-1%" y="-1%" width="102%" height="102%" color-interpolation-filters="sRGB">
                  <feGaussianBlur in="SourceAlpha" stdDeviation="1.1"/>
                  <feOffset dx="1.2" dy="2" result="silhouette"/>
                  <feFlood flood-color="#21180f" flood-opacity=".24"/>
                  <feComposite in2="silhouette" operator="in"/>
                </filter>
                <filter id="paradai-soft-shadow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="2.1"/></filter>
              </defs>
              <!-- Read the approved image only to cast a separate shadow. Its
                   visible pixels, alpha, outline and rendering remain untouched. -->
              <image href="assets/cabinet-photo-objects-v75.svg" width="1672" height="941" filter="url(#wrapper-contact-shadow)"/>
              <path d="M369 882L546 838L554 844L382 887Z" fill="#19110c" opacity=".21" filter="url(#paradai-soft-shadow)"/>
            </svg>
            <img class="photo-object-layer" src="assets/cabinet-photo-objects-v75.svg" width="1672" height="941" fetchpriority="high" alt="" aria-hidden="true">
            <img class="crochet-eye crochet-eye-green" data-eye="green-crocheted-eye" src="assets/cabinet-photo-objects-v75.svg#green" width="160" height="150" alt="" aria-hidden="true">
            <img class="crochet-eye crochet-eye-yellow" data-eye="yellow-crocheted-eye" src="assets/cabinet-photo-objects-v76.svg#yellow" width="160" height="140" alt="" aria-hidden="true">
            <button class="chof-link" id="chof-link" type="button" aria-haspopup="dialog" aria-controls="detail-dialog" aria-label="Chof. Open details.">
              <img src="assets/chof-chocolate-sun-v1.png" width="360" height="360" alt="" aria-hidden="true">
              <span class="chof-link-label">Chof</span>
            </button>
            <div class="hotspot-layer" id="hotspot-layer" aria-label="Objects on the display board"></div>
          </div>
        </figure>
        </div>
      </div>
      <p class="explore-hint" id="explore-hint">Select an object, or browse the collection by name.</p>
      <div class="scene-controls" id="scene-controls" role="group" aria-label="Scene view controls" hidden>
        <button class="scene-control" id="scene-zoom-out" type="button" aria-label="Zoom out">−</button>
        <button class="scene-control scene-reset" id="scene-reset" type="button" aria-label="Reset view">100%</button>
        <button class="scene-control" id="scene-zoom-in" type="button" aria-label="Zoom in">+</button>
      </div>
      <p class="sr-only" id="scene-view-status" role="status" aria-live="polite"></p>
      <div class="object-preview" id="object-preview" role="status" aria-live="polite" hidden>
        <strong id="preview-title"></strong>
        <span id="preview-description" hidden></span>
      </div>
    </section>

    <section class="portrait-collection" id="portrait-collection" aria-labelledby="portrait-collection-heading">
      <button class="portrait-cabinet-toggle collection-toggle" id="portrait-cabinet-toggle" type="button" aria-controls="cabinet-stage">Cabinet view</button>
      <h1 id="portrait-collection-heading">Browse the collection</h1>
      <div id="portrait-collection-list"></div>
    </section>

    <dialog class="collection-panel" id="collection-panel" aria-labelledby="collection-heading">
      <div class="collection-panel-head">
        <div>
          <p class="eyebrow">Object index</p>
          <h2 id="collection-heading">Browse the collection</h2>
        </div>
        <button class="icon-button" id="collection-close" type="button" aria-label="Close collection index">×</button>
      </div>
      <div id="collection-list" class="collection-list"></div>
    </dialog>

    <dialog class="detail-dialog" id="detail-dialog" aria-labelledby="detail-title">
      <div class="dialog-ornament" aria-hidden="true"></div>
      <button class="icon-button detail-close" id="detail-close" type="button" aria-label="Close object details">×</button>
      <p class="detail-kicker" id="detail-kind"></p>
      <h2 id="detail-title"></h2>
      <dl class="detail-facts" id="detail-facts"></dl>
      <p class="detail-note" id="detail-note"></p>
      <a class="detail-link" id="detail-link" href="#" target="_blank" rel="noreferrer" hidden></a>
    </dialog>

  </main>

  <script src="cabinet-data.js?v=20260829-3"></script>
  <script src="cabinet-product-images.js?v=20260906-17"></script>
  <script src="cabinet-i18n.js?v=20260906-5"></script>
  <script src="cabinet.js?v=20260906-19"></script>
</body>
</html>
